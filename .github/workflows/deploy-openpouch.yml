name: Deploy to openpouch

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'public/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-openpouch.yml'
  schedule:
    - cron: '*/30 * * * *'   # retry automatically while openpouch is at capacity
  workflow_dispatch:
    inputs:
      password:
        description: 'كلمة سر الموقع (تُحقن كمتغير بيئة في الاستضافة)'
        required: false
        default: 'Kosmos@2026'

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy (Dockerfile → openpouch)
        env:
          APP_PASSWORD: ${{ inputs.password || 'Kosmos@2026' }}
        run: |
          set +e
          attempt=1
          max=5
          while [ $attempt -le $max ]; do
            echo "::group::openpouch deploy attempt $attempt/$max"
            npx -y openpouch@latest deploy . \
              --json \
              --health-path /api/health \
              --var APP_PASSWORD="$APP_PASSWORD" > /tmp/deploy.json 2>/tmp/deploy.err
            code=$?
            cat /tmp/deploy.json || true
            attempt=$((attempt+1))
            echo "::endgroup::"
            # success, or a real (non-capacity) failure -> stop retrying
            if [ $code -eq 0 ] && grep -q '"ok": *true' /tmp/deploy.json 2>/dev/null; then break; fi
            if ! grep -qiE 'at capacity|503|try again later' /tmp/deploy.json /tmp/deploy.err 2>/dev/null; then
              echo "non-capacity failure, not retrying"
              break
            fi
            if [ $attempt -le $max ]; then
              echo "host at capacity — backing off ${attempt}0s"
              sleep $((attempt*10))
            fi
          done
          echo "openpouch final exit code: $code"
          node -e "
            const fs=require('fs');
            let r={};
            try { r=JSON.parse(fs.readFileSync('/tmp/deploy.json','utf8')); } catch(e) { console.log('could not parse deploy output'); }
            const url=r.url||r.previewUrl||'';
            console.log('URL:', url||'(none)');
            console.log(r.summary||'');
            if (process.env.GITHUB_STEP_SUMMARY) {
              const lines=['## openpouch deployment','',
                '- status: **'+(r.ok?'ok':'failed')+'**',
                '- url: '+(url||'_none_'),
                '- health: '+(r.healthStatus||'unknown'),
                r.claimUrl?'- claim: '+r.claimUrl:'',
                '', r.summary?'> '+String(r.summary).replace(/\n/g,' '):''];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');
            }
          "
          exit $code

      - name: Report failure details as an issue
        if: failure() && !contains(github.event_name, 'schedule')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '```json'
            tail -c 4000 /tmp/deploy.json 2>/dev/null || echo '(no stdout)'
            echo '```'
            echo
            echo '### stderr'
            echo '```'
            tail -c 4000 /tmp/deploy.err 2>/dev/null || echo '(no stderr)'
            echo '```'
          } > /tmp/issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "openpouch deploy failed (run $GITHUB_RUN_ID)" \
            --body-file /tmp/issue.md || true

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpouch-deploy
          path: |
            /tmp/deploy.json
            deploy.evidence.json
            DEPLOYMENT.md
          if-no-files-found: ignore
