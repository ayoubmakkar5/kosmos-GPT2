name: Deploy to openpouch

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'كلمة سر الموقع (تُحقن كمتغير بيئة في الاستضافة)'
        required: true
        default: 'Kosmos@2026'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy (Dockerfile → openpouch)
        env:
          APP_PASSWORD: ${{ inputs.password }}
        run: |
          npx -y openpouch@latest deploy . \
            --json \
            --health-path /api/health \
            --var APP_PASSWORD="$APP_PASSWORD" \
            | tee /tmp/deploy.json
          node -e "const r=require('/tmp/deploy.json');console.log('URL:',r.url||'(none)');console.log(r.summary||'')"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpouch-deploy
          path: |
            /tmp/deploy.json
            deploy.evidence.json
            DEPLOYMENT.md
          if-no-files-found: ignore
