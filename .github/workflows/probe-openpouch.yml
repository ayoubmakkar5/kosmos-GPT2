name: Probe openpouch capacity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-openpouch.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'optional --app name'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  probe-kosmos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe (static mini app)
        run: |
          set +e
          mkdir -p probe && printf '<!doctype html><title>probe</title><h1>probe ok</h1>' > probe/index.html
          npx -y openpouch@latest deploy probe --json | tee /tmp/probe.json
          echo "::group::parsed"
          node -e "
            const r=JSON.parse(require('fs').readFileSync('/tmp/probe.json','utf8'));
            console.log('ok:', r.ok, '| url:', r.url||'(none)', '| health:', r.healthStatus||'-');
            console.log('error:', r.error ? r.error.category+': '+r.error.message : '-');
            console.log('RESULT_JSON=' + JSON.stringify({ok:r.ok, url:r.url, claim:r.claimUrl, health:r.healthStatus, error:r.error&&r.error.message}));
            if (process.env.GITHUB_STEP_SUMMARY) require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## openpouch probe\n\n- ok: **'+r.ok+'**\n- url: '+(r.url||'_none_')+'\n- error: '+((r.error&&r.error.message)||'-')+'\n');
          "

  probe-app:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy the real Kosmos Code folder
        env:
          APP_PASSWORD: Kosmos@2026
        run: |
          set +e
          npx -y openpouch@latest deploy . --json --health-path /api/health --var APP_PASSWORD="$APP_PASSWORD" > /tmp/app.json 2>/tmp/app.err
          echo "exit=$?"
          cat /tmp/app.json
          node -e "
            let r={}; try { r=JSON.parse(require('fs').readFileSync('/tmp/app.json','utf8')); } catch(e){}
            console.log('RESULT_JSON=' + JSON.stringify({ok:r.ok,url:r.url,claim:r.claimUrl,health:r.healthStatus,error:r.error&&r.error.message}));
          "

      - name: Publish result
        if: always()
        run: |
          mkdir -p .deploy
          cp /tmp/probe.json .deploy/probe-static.json 2>/dev/null || true
          cp /tmp/app.json .deploy/probe-app.json 2>/dev/null || true
          git config user.name "openpouch-probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f .deploy || true
          git commit -m "probe: publish openpouch result [skip ci]" || true
          git push || true
