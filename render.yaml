services:
  - type: web
    name: kosmos-code
    runtime: docker
    plan: standard          # 2 GB RAM مطلوبة لتحميل النموذج
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_PASSWORD
        sync: false         # أدخل كلمة السر من لوحة Render
      - key: SESSION_SECRET
        generateValue: true
      - key: CTX_SIZE
        value: "4096"
      - key: NODE_ENV
        value: production
